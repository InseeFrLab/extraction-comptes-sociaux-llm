[project]
name = "api-chandra"
version = "0.1.0"
description = "API d'extraction de tableaux via le VLM Chandra"
requires-python = ">=3.13"
dependencies = [
    # Le client d'appel de ce paquet n'est plus utilisé : l'API parle directement au serveur
    # vllm. Seuls en restent `chandra.prompts.PROMPT_MAPPING` (le champ `prompt_type`, pour
    # ne pas recopier des consignes qui dériveraient) et `chandra.model.util
    # .detect_repeat_token` (marquage des générations en boucle, au critère pour lequel le
    # modèle a été réglé).
    "chandra-ocr>=0.2.0",
    "fastapi>=0.136.0",
    "openai>=1.0.0",
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "uvicorn[standard]>=0.45.0",
]
