name: Site de diagnostic

on:
  push:
    branches:
      - main
    # Ne republie que si le site ou ce dont il dépend a bougé.
    paths:
      - "website/**"
      # Les chemins et moteurs que le site publie viennent de la config des corpus.
      - "config/**"
      # `website/scripts/build_data*.py` réutilise les fonctions de la mesure.
      - "scripts/config.py"
      - "scripts/evaluation.py"
      - "scripts/corpus_historiques.py"
      - "scripts/json_to_csv.py"
      - "libs/**"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

# Une seule publication à la fois, mais sans annuler celle en cours : couper un
# deploy-pages à mi-parcours laisse l'environnement Pages dans un état incohérent.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Rendu Quarto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "website/uv.lock"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      # Les grilles de comparaison viennent de S3 et ne sont pas versionnées.
      # continue-on-error : sans identifiants (ou avec un jeton expiré), le site doit
      # rester publiable — la page de comparaison affiche alors un message
      # d'indisponibilité et les trois autres pages sont complètes.
      - name: Récupérer les données
        id: data
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
        run: |
          uv run --project website python website/scripts/build_data.py
          uv run --project website python website/scripts/build_data_historiques.py

      - name: Signaler l'absence de données
        if: steps.data.outcome == 'failure'
        run: |
          echo "::warning title=Comparaison indisponible::La récupération S3 a échoué :" \
               "les pages « Comparaison » seront publiées sans les grilles." \
               "Vérifier les secrets AWS_* (un AWS_SESSION_TOKEN temporaire expire)."

      - name: quarto render
        run: quarto render website

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    name: Publication GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
